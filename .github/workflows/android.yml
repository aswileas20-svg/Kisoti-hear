
name: Build Kisoti-Hear APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - Kisoti-Hear-Test

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Set up Android NDK and CMake
        run: |
          sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1" "build-tools;34.0.0"

      - name: Download Whisper.cpp
        run: |
          git clone --branch v1.9.5 --depth 1 --recurse-submodules --shallow-submodules https://github.com/ggml-org/whisper.cpp.git app/src/main/cpp/whisper.cpp

      - name: Verify Whisper.cpp
        run: |
          test -f app/src/main/cpp/whisper.cpp/CMakeLists.txt
          test -f app/src/main/cpp/whisper.cpp/ggml/CMakeLists.txt

      - name: Check AndroidManifest XML
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse("app/src/main/AndroidManifest.xml")
          print("MANIFEST XML IS VALID!")
          PY

      - name: Build Android APK
        run: gradle assembleDebug --stacktrace

      - name: Sign APK with permanent key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > kisoti-release.jks

          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
            --ks kisoti-release.jks \
            --ks-key-alias kisoti \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEYSTORE_PASSWORD \
            --out app/build/outputs/apk/debug/Kisoti-Hear.apk \
            app/build/outputs/apk/debug/app-debug.apk

          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify \
            app/build/outputs/apk/debug/Kisoti-Hear.apk

          rm -f kisoti-release.jks

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Kisoti-Hear-Signed-APK
          path: app/build/outputs/apk/debug/Kisoti-Hear.apk
