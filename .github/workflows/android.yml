
name: Build Kisoti-Hear APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - Kisoti-Hear-Test

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Set up Android NDK and CMake
        run: |
          sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Download Whisper.cpp
        run: |
          git clone --branch v1.9.5 --depth 1 --recurse-submodules --shallow-submodules https://github.com/ggml-org/whisper.cpp.git app/src/main/cpp/whisper.cpp

      - name: Verify Whisper.cpp
        run: |
          test -f app/src/main/cpp/whisper.cpp/CMakeLists.txt
          test -f app/src/main/cpp/whisper.cpp/ggml/CMakeLists.txt
          echo "WHISPER.CPP SOURCE IS READY!"

      - name: Check AndroidManifest XML
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          file = "app/src/main/AndroidManifest.xml"

          try:
              ET.parse(file)
              print("MANIFEST XML IS VALID!")
          except ET.ParseError as error:
              print("MANIFEST ERROR FOUND!")
              print("Details:", error)
              raise
          PY

      - name: Build Android APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kisoti-Hear-APK
          path: app/build/outputs/apk/debug/app-debug.apk
